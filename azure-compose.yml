services:
  # Backend
  backend:
    image: asmaes/webintel-backend:latest
    container_name: webintel-backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - REDIS_URL=redis://redis:6379
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      - mongodb
      - redis
    networks:
      - app-network

  # Worker
  worker:
    image: asmaes/webintel-backend:latest
    container_name: webintel-worker
    command: rq worker discovery scrape --url redis://redis:6379
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - REDIS_URL=redis://redis:6379
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      - backend
      - redis
      - mongodb
    networks:
      - app-network

  # Frontend
  frontend:
    image: asmaes/webintel-frontend:latest
    container_name: webintel-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

  # MongoDB
  mongodb:
    image: mongo:7.0
    container_name: webintel-mongo
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: webintel-redis
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongo_data:
